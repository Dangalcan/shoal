version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the same version (a mismatch breaks
      # every test), so they and their types always move together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # The other renderer libraries are devDependencies too (Vite bundles
      # them into the app), but they change what users see, so they get their
      # own PR instead of disappearing into the tooling group below.
      renderer:
        patterns:
          [
            '@xterm/*',
            'clsx',
            'lucide-react',
            'react-router-dom',
            'sonner',
            'tailwind-merge',
          ]
      # One PR for all dev tooling bumps instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors that change the native ABI or the runtime need a manual
      # upgrade with a packaged build and the smoke test (see docs/RELEASE.md).
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
      - dependency-name: node-pty
        update-types: ['version-update:semver-major']
      # Every other major waits until after the 0.9 beta launch (November
      # 2026); remove this entry afterwards so they come back as PRs.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
