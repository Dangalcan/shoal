version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all dev tooling bumps instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors that change the native ABI or the runtime need a manual
      # upgrade with a packaged build and the smoke test (see docs/RELEASE.md).
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
