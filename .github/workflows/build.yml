name: Build/Release

on:
  # Master builds run only after the CI workflow (typecheck + tests) has
  # completed successfully for that commit.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Publishing to GitHub Releases needs write access to the repo contents.
permissions:
  contents: write

# Every action in these workflows is pinned to a commit (the version is in
# the trailing comment; Dependabot bumps the pins). A moved tag cannot change
# what runs with the release token.

jobs:
  release:
    # Gate on CI success when triggered by workflow_run; tag pushes and
    # manual dispatches build directly. The workflow_run `branches` filter
    # matches the triggering run's branch NAME, so a pull request from a fork
    # whose branch is called "master" would also match: only accept runs for
    # pushes to this repository, never pull_request runs or forks, because
    # this job holds a write token.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026, and the
        # Linux build and smoke test rely on 24.04 (libfuse2t64, AppArmor).
        os: [windows-latest, ubuntu-24.04]

    env:
      # Tag pushes (v*) upload the installers and update feeds to a DRAFT
      # GitHub release, which a maintainer publishes after the smoke test
      # (see docs/RELEASE.md). Every other run only builds and keeps the
      # installers as workflow artifacts.
      PUBLISH_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For workflow_run, build the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Build steps must not find a write token in .git/config.
          persist-credentials: false

      # electron-builder names the draft release after package.json, not after
      # the tag, so a tag pushed before the version bump (v0.9.0-rc.3 while
      # package.json still says 0.9.0-rc.2) would upload into the previous
      # draft and overwrite its installers and update feeds. Refuse the
      # mismatch before anything is built.
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected). Bump the version or move the tag."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # node-pty ships a Windows x64 prebuild but none for Linux, and
      # `npm ci` keeps install scripts off, so the Linux binary is compiled
      # here (node-gyp against the Node headers; the module uses Node-API,
      # so the result also loads in Electron). The runner has make, g++ and
      # python. Without this step the AppImage would still work, with local
      # shells on pipes instead of a pseudo-terminal.
      - name: Build node-pty (Linux)
        if: runner.os == 'Linux'
        run: npm run rebuild:node-pty

      - name: Build renderer and main process
        run: npm run build:react && npm run build:electron

      - name: Package installers (publish on tags)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish ${{ env.PUBLISH_MODE }}

      # electron-builder creates either a draft or a pre-release, never both.
      # Release candidates (tags with a hyphen, e.g. v0.9.0-rc.2) stay drafts
      # until the smoke test passes and are flagged as pre-releases here, so
      # publishing them never makes them the latest release by mistake.
      - name: Flag release candidate drafts as pre-releases
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease

      # Master and manual builds hand the installers to the smoke and deb
      # jobs as a one-day artifact holding only what those jobs install (the
      # NSIS setup on Windows, the AppImage and the .deb on Linux; the
      # portable build and the update feeds stay on the runner). Tag builds
      # skip this: the draft release already holds the files and the jobs
      # download them from there, so a release never depends on artifact
      # storage (the free plan's quota is counted in GB-months and, once hit,
      # blocks every upload until the billing cycle ends; 14 days of ~470 MB
      # per run hit it on 2026-10-12, while the repository was private).
      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shoal-${{ matrix.os }}
          path: |
            release/Shoal-Setup-*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 1

  smoke:
    # Installs the freshly built package on a clean runner and runs the E2E
    # suite against the installed app (e2e/fixtures/launch.ts reads
    # SHOAL_E2E_EXECUTABLE). Runs on tags and manual runs, and on every
    # master build once the repository is public (Actions minutes are free
    # then; while it is private they count against the plan).
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && !github.event.repository.private)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 October 2026, and the
        # Linux build and smoke test rely on 24.04 (libfuse2t64, AppArmor).
        os: [windows-latest, ubuntu-24.04]

    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the commit the release job packaged.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (Playwright)
        run: npm ci

      - name: Download installers (workflow artifact)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shoal-${{ matrix.os }}
          path: installers

      # Tag builds take the installer from the draft release the release job
      # just created (the workflow token can read drafts), so the smoke test
      # checks exactly the file users will download.
      - name: Download installers (draft release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --dir installers
          --pattern "${{ runner.os == 'Windows' && 'Shoal-Setup-*.exe' || '*.AppImage' }}"

      - name: Install Shoal silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter 'Shoal-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Shoal-Setup-*.exe not found in the artifact' }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Shoal.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Shoal.exe not found after the silent install' }
          Write-Host "Installed at $($exe.FullName)"
          "SHOAL_E2E_EXECUTABLE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls installers/*.AppImage | head -n 1)
          chmod +x "$appimage"
          echo "SHOAL_E2E_EXECUTABLE=$PWD/$appimage" >> "$GITHUB_ENV"
          # The runner has no libfuse2; run the AppImage from an extracted copy.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install kind (Linux)
        if: runner.os == 'Linux'
        # Third-party action in a job that holds a write token: pinned to a
        # commit (Dependabot bumps the pin).
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install kubectl (Windows)
        if: runner.os == 'Windows'
        # The first-run spec needs kubectl on the PATH. Third-party action in
        # a job that holds a write token: pinned to a commit.
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Smoke tests on the installed app (Windows, no clusters)
        if: runner.os == 'Windows'
        # The Windows runner cannot run Linux containers, so the three specs
        # that create kind clusters are left out.
        run: >-
          npx playwright test
          e2e/features/navigation.spec.ts
          e2e/features/first-run.spec.ts
          e2e/features/settings.spec.ts
          e2e/features/terminal.spec.ts
          e2e/features/manifests.spec.ts
          e2e/features/migration.spec.ts
          e2e/features/plugins.spec.ts
          e2e/features/sandbox-widget.spec.ts
          e2e/features/sandbox-theme.spec.ts
          e2e/features/sandbox-escape.spec.ts

      - name: Smoke tests on the AppImage (Linux, with kind clusters)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: Upload Playwright report
        if: always()
        # A hit artifact quota must not turn a passing smoke test red.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.os }}
          path: e2e-report
          retention-days: 7

  deb:
    # Installs the .deb on a bare ubuntu:24.04 container and fails when apt
    # leaves a linked shared library unresolved (scripts/check-deb.sh). The
    # runner image has every desktop library preinstalled, so the smoke job
    # above cannot notice a dependency missing from the package's Depends
    # list: 0.9.0 shipped without libasound2 and failed to start on WSL and
    # other minimal installs. Same triggers as the smoke job.
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && !github.event.repository.private)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Download installers (workflow artifact)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shoal-ubuntu-24.04
          path: installers

      - name: Download installers (draft release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --dir installers --pattern '*.deb'

      - name: Install the .deb on a bare Ubuntu 24.04 container
        run: |
          deb=$(ls installers/*.deb | head -n 1)
          if [ -z "$deb" ]; then echo "::error::no .deb among the installers"; exit 1; fi
          docker run --rm \
            -v "$PWD/installers:/pkg:ro" \
            -v "$PWD/scripts/check-deb.sh:/check-deb.sh:ro" \
            ubuntu:24.04 bash /check-deb.sh "/pkg/$(basename "$deb")"
