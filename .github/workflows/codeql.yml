name: CodeQL

# GitHub's static analysis for JavaScript and TypeScript. Code scanning is
# free for public repositories only, so the job skips itself while the
# repository is private (like the smoke job in build.yml) and starts on the
# first push after the repository goes public.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          # Generated or vendored code is not ours to fix.
          config: |
            paths-ignore:
              - public/plugin-host/bootstrap.js
              - dist
              - dist-electron
              - release

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
