name: CodeQL

# GitHub's static analysis for JavaScript and TypeScript. Code scanning is
# free for public repositories only, so the analysis skips itself while the
# repository is private (like the smoke job in build.yml) and starts on the
# first run after the repository goes public.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Pushes, pull requests and manual runs carry the repository in their event
  # payload, but scheduled runs have no payload at all (github.event holds
  # only the cron expression), so `github.event.repository.private` is empty
  # there and a plain `if` on it would run the weekly analysis against a
  # private repository, where it fails. Ask the API instead, for every event.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      private: ${{ steps.repo.outputs.private }}
    steps:
      - name: Read the repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (javascript-typescript)
    needs: visibility
    if: needs.visibility.outputs.private == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # Generated or vendored code is not ours to fix.
          config: |
            paths-ignore:
              - public/plugin-host/bootstrap.js
              - dist
              - dist-electron
              - release

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
