name: Secret scan

# Pushes and pull requests scan the new commits; a manual run scans the
# whole history (required before the repository goes public).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists the commits of a pull request through the API.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        # Third-party action: pinned to a commit (Dependabot bumps the pin).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job summary. Pull request comments are off: the
          # token is read-only on pull requests from forks, so the comment
          # would fail the job instead of reporting the leak.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # The findings go to the job summary; the SARIF artifact only
          # consumes the artifact storage quota (an exhausted quota failed
          # the job even with no leaks found).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
