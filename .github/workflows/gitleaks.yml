name: Secret scan

# Pushes and pull requests scan the new commits; a manual run scans the
# whole history (required before the repository goes public).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The findings go to the job summary; the SARIF artifact only
          # consumes the artifact storage quota (an exhausted quota failed
          # the job even with no leaks found).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
