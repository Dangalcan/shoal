name: CI

on:
  push:
    branches:
      - master
      - security-hardening
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (electron main process)
        run: npm run build:electron

      - name: Typecheck (renderer)
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npm test
        # Note: the root vitest run also executes the marketplace-backend
        # catalog tests. A dedicated backend job is intentionally omitted —
        # the backend is being extracted to its own repo, which will own its
        # build/test pipeline.
