name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (electron main process)
        run: npm run build:electron

      - name: Typecheck (renderer)
        run: npx tsc --noEmit

      - name: Lint (Prettier)
        run: npm run lint:prettier

      - name: Unit & integration tests
        # With coverage: the job fails if a threshold in vitest.config.ts
        # (90 lines/statements/functions, 80 branches) drops.
        run: npm run test:coverage
        # Note: marketplace-backend/** is EXCLUDED from the root vitest run
        # (legacy dev-only mock; see vitest.config.ts). The real backend is
        # kdMarket, a separate repo that owns its own build/test pipeline.
