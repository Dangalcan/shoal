name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (electron main process)
        run: npm run build:electron

      - name: Typecheck (renderer)
        run: npx tsc --noEmit

      - name: Typecheck (tests)
        # The Vitest and Playwright files are outside the two configs above.
        run: npm run typecheck:test

      - name: Lint (Prettier)
        run: npm run lint:prettier

      - name: Lint (ESLint)
        run: npm run lint:eslint

      - name: Unit & integration tests
        # With coverage: the job fails if a threshold in vitest.config.ts
        # (90 lines/statements/functions, 80 branches) drops.
        run: npm run test:coverage
