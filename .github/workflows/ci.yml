name: CI

on:
  push:
    branches:
      - master
      - security-hardening
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (electron main process)
        run: npm run build:electron

      - name: Typecheck (renderer)
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npm test
        # Note: marketplace-backend/** is EXCLUDED from the root vitest run
        # (legacy dev-only mock; see vitest.config.ts). The real backend is
        # kdMarket, a separate repo that owns its own build/test pipeline.
