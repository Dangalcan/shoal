name: Feature request
description: Suggest an improvement or a new feature
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you run into today, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Shoal to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other tools, workarounds, or ways this could work.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, mockups, links.
